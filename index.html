<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Roblox Studio Web - Pro Builder</title>
  <style>
    :root {
      --bg-dark: #181818;
      --bg-panel: #222222;
      --bg-header: #2c2c2c;
      --bg-input: #121212;
      --border-color: #383838;
      --studio-blue: #00a2ff;
      --studio-red: #ff4d4d;
      --studio-green: #00b34a;
      --text-main: #dddddd;
      --text-bright: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* TOP HEADER */
    header {
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: bold;
      background: #111111;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ribbon {
      display: flex;
      padding: 8px;
      gap: 8px;
      overflow-x: auto;
      background: var(--bg-header);
      -webkit-overflow-scrolling: touch;
    }

    .ribbon-btn {
      background: var(--bg-panel);
      color: var(--text-bright);
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .ribbon-btn:active {
      background: var(--studio-blue);
    }

    .export-btn {
      background: var(--studio-green);
      border-color: #00e65c;
    }

    /* MOBILE LANDSCAPE VIEWPORT */
    .viewport-container {
      background: #0d0d0d;
      background-image: radial-gradient(#252525 1px, transparent 0);
      background-size: 16px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      position: relative;
      flex: 1.1;
      border-bottom: 1px solid var(--border-color);
      overflow: hidden;
    }

    #screen-gui {
      width: 100%;
      max-width: 420px;
      aspect-ratio: 16 / 9;
      background: rgba(255, 255, 255, 0.02);
      border: 2px dashed #555555;
      position: relative;
      overflow: visible;
      border-radius: 8px;
    }

    /* INSTANCES ON CANVAS */
    .studio-instance {
      position: absolute;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      touch-action: none;
      background-size: cover;
      background-position: center;
    }

    .studio-instance.selected {
      outline: 2px solid var(--studio-blue);
      outline-offset: -1px;
    }

    /* HAND RESIZE HANDLE (BOTTOM-RIGHT CORNER) */
    .resize-handle {
      position: absolute;
      width: 16px;
      height: 16px;
      background: var(--studio-blue);
      border: 2px solid #ffffff;
      border-radius: 4px;
      bottom: -8px;
      right: -8px;
      display: none;
      touch-action: none;
      z-index: 99;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    .studio-instance.selected .resize-handle {
      display: block;
    }

    /* QUICK ACTION BAR */
    .quick-bar {
      background: #1d1d1d;
      padding: 8px 12px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border-color);
      overflow-x: auto;
    }

    .action-btn {
      flex: 1;
      background: var(--bg-panel);
      color: var(--text-bright);
      border: 1px solid var(--border-color);
      padding: 10px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 6px;
      white-space: nowrap;
      text-align: center;
    }

    .action-btn.delete {
      background: #8b0000;
      border-color: var(--studio-red);
      color: #ffffff;
    }

    /* BOTTOM TABS */
    .bottom-system {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-panel);
      overflow: hidden;
    }

    .tab-headers {
      display: flex;
      background: #141414;
      border-bottom: 1px solid var(--border-color);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      color: #888;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
    }

    .tab-btn.active {
      color: var(--studio-blue);
      border-bottom-color: var(--studio-blue);
      background: var(--bg-panel);
    }

    .tab-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: none;
      -webkit-overflow-scrolling: touch;
    }

    .tab-content.active {
      display: block;
    }

    /* PROPERTIES FORM */
    .prop-section-title {
      font-size: 11px;
      font-weight: bold;
      color: var(--studio-blue);
      text-transform: uppercase;
      margin: 12px 0 6px 0;
      border-bottom: 1px solid #333;
      padding-bottom: 2px;
    }

    .prop-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      gap: 10px;
    }

    .prop-row label {
      font-size: 12px;
      color: #aaa;
      width: 45%;
    }

    .prop-row input, .prop-row select, .prop-row textarea {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 13px;
    }

    .prop-row textarea {
      height: 50px;
      font-family: monospace;
      font-size: 11px;
    }

    /* EXPLORER ITEM LIST */
    .tree-item {
      padding: 10px;
      background: #1a1a1a;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tree-item.selected {
      border-color: var(--studio-blue);
      background: #003355;
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      padding: 16px;
      flex-direction: column;
    }

    .modal textarea {
      flex: 1;
      background: var(--bg-input);
      color: #00ffcc;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px;
      font-family: monospace;
      font-size: 11px;
      white-space: pre;
    }

    .modal-close {
      background: var(--studio-blue);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <header>
    <div class="top-bar">
      <span>Roblox Studio Web v2.1</span>
      <span id="instance-count" style="color: var(--studio-blue)">0 Items</span>
    </div>
    <div class="ribbon">
      <button class="ribbon-btn" onclick="addInstance('Frame')">🟩 + Frame</button>
      <button class="ribbon-btn" onclick="addInstance('TextButton')">🟦 + Button</button>
      <button class="ribbon-btn" onclick="addInstance('ImageLabel')">🖼️ + Image</button>
      <button class="ribbon-btn" onclick="addInstance('TextLabel')">🟨 + Label</button>
      <button class="ribbon-btn" onclick="addInstance('TextBox')">⬜ + TextBox</button>
      <button class="ribbon-btn export-btn" onclick="exportLua()">📜 Export Script</button>
    </div>
  </header>

  <!-- VIEWPORT -->
  <div class="viewport-container">
    <div id="screen-gui"></div>
  </div>

  <!-- QUICK ACTION TOOLBAR -->
  <div class="quick-bar">
    <button class="action-btn delete" onclick="deleteSelected()">🗑️ Delete</button>
    <button class="action-btn" onclick="quickAlign('center')">🎯 Center</button>
    <button class="action-btn" onclick="duplicateSelected()">📋 Duplicate</button>
    <button class="action-btn" onclick="quickAlign('full')">📐 Fill Screen</button>
  </div>

  <!-- BOTTOM TABS -->
  <div class="bottom-system">
    <div class="tab-headers">
      <button class="tab-btn active" id="btn-properties" onclick="switchTab('properties')">⚙️ Properties</button>
      <button class="tab-btn" id="btn-explorer" onclick="switchTab('explorer')">📂 Explorer</button>
    </div>

    <!-- PROPERTIES PANEL -->
    <div class="tab-content active" id="tab-properties">
      <div id="properties-form">
        <p style="color: #666; text-align: center; padding: 20px;">Tap an element on screen to edit properties.</p>
      </div>
    </div>

    <!-- EXPLORER PANEL -->
    <div class="tab-content" id="tab-explorer">
      <div id="explorer-list">
        <div class="tree-item" style="color: var(--studio-blue)">📂 ScreenGui</div>
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal" id="codeModal">
    <textarea id="luaOutput" readonly></textarea>
    <button class="modal-close" onclick="closeModal()">Copy Script & Close</button>
  </div>

  <script>
    const screenGui = document.getElementById('screen-gui');
    const explorerList = document.getElementById('explorer-list');
    const propertiesForm = document.getElementById('properties-form');
    const instanceCount = document.getElementById('instance-count');

    let instances = [];
    let selectedId = null;
    let counter = 0;

    function addInstance(type) {
      counter++;
      const id = 'inst_' + counter;
      
      const newInst = {
        id: id,
        type: type,
        name: type + counter,
        parentId: 'ScreenGui',
        x: 20,
        y: 20,
        width: type === 'Frame' ? 150 : 100,
        height: type === 'Frame' ? 100 : 32,
        bgColor: type === 'Frame' ? '#1f1f28' : '#2d2d3a',
        bgTransparency: 0,
        textColor: '#ffffff',
        text: (type === 'Frame' || type === 'ImageLabel') ? '' : type,
        textSize: 12,
        font: 'GothamBold',
        textAlign: 'Center',
        hasCorner: true,
        cornerRadius: 6,
        hasBorder: false,
        borderColor: '#00a2ff',
        borderThickness: 2,
        imageId: '',
        draggable: type === 'Frame',
        customScript: type.includes('Button') ? 'print("Button clicked!")' : ''
      };

      instances.push(newInst);
      renderInstance(newInst);
      updateExplorer();
      selectInstance(id);
    }

    function renderInstance(data) {
      let dom = document.getElementById(data.id);
      if (!dom) {
        dom = document.createElement('div');
        dom.id = data.id;
        dom.className = 'studio-instance';

        // Attach to designated parent frame or ScreenGui
        const parentDom = (data.parentId !== 'ScreenGui' && document.getElementById(data.parentId)) 
          ? document.getElementById(data.parentId) 
          : screenGui;
        
        parentDom.appendChild(dom);

        // CREATE RESIZE HANDLE
        const resizeHandle = document.createElement('div');
        resizeHandle.className = 'resize-handle';
        dom.appendChild(resizeHandle);

        // --- Touch & Drag Move Handling ---
        let isDragging = false;
        let startX, startY;

        const startMove = (e) => {
          isDragging = true;
          const touch = e.touches ? e.touches[0] : e;
          startX = touch.clientX - data.x;
          startY = touch.clientY - data.y;
          selectInstance(data.id);
          e.stopPropagation();
        };

        const doMove = (e) => {
          if (!isDragging) return;
          if (e.touches) e.preventDefault();
          const touch = e.touches ? e.touches[0] : e;
          
          const parentWidth = parentDom.clientWidth || screenGui.clientWidth;
          const parentHeight = parentDom.clientHeight || screenGui.clientHeight;

          data.x = Math.max(0, Math.min(parentWidth - data.width, touch.clientX - startX));
          data.y = Math.max(0, Math.min(parentHeight - data.height, touch.clientY - startY));
          updateDom(data);
          updateProperties();
        };

        const endMove = () => { isDragging = false; };

        dom.addEventListener('touchstart', startMove, {passive: false});
        dom.addEventListener('touchmove', doMove, {passive: false});
        dom.addEventListener('touchend', endMove);
        dom.addEventListener('mousedown', startMove);
        window.addEventListener('mousemove', doMove);
        window.addEventListener('mouseup', endMove);

        // --- Touch & Drag Resize Handling (Crop Style) ---
        let isResizing = false;
        let rStartX, rStartY, startW, startH;

        const startResize = (e) => {
          isResizing = true;
          e.stopPropagation();
          const touch = e.touches ? e.touches[0] : e;
          rStartX = touch.clientX;
          rStartY = touch.clientY;
          startW = data.width;
          startH = data.height;
        };

        const doResize = (e) => {
          if (!isResizing) return;
          if (e.touches) e.preventDefault();
          e.stopPropagation();
          const touch = e.touches ? e.touches[0] : e;
          
          const deltaX = touch.clientX - rStartX;
          const deltaY = touch.clientY - rStartY;

          data.width = Math.max(25, Math.round(startW + deltaX));
          data.height = Math.max(18, Math.round(startH + deltaY));
          
          updateDom(data);
          updateProperties();
        };

        const endResize = (e) => {
          if (isResizing) {
            isResizing = false;
            e.stopPropagation();
          }
        };

        resizeHandle.addEventListener('touchstart', startResize, {passive: false});
        resizeHandle.addEventListener('touchmove', doResize, {passive: false});
        resizeHandle.addEventListener('touchend', endResize);
        resizeHandle.addEventListener('mousedown', startResize);
        window.addEventListener('mousemove', doResize);
        window.addEventListener('mouseup', endResize);
      }

      updateDom(data);
    }

    function updateDom(data) {
      const dom = document.getElementById(data.id);
      
      // Reparent if parent changed
      const currentParent = dom.parentElement;
      const targetParent = (data.parentId !== 'ScreenGui' && document.getElementById(data.parentId)) 
        ? document.getElementById(data.parentId) 
        : screenGui;
      
      if (currentParent !== targetParent) {
        targetParent.appendChild(dom);
      }

      dom.style.left = data.x + 'px';
      dom.style.top = data.y + 'px';
      dom.style.width = data.width + 'px';
      dom.style.height = data.height + 'px';
      dom.style.backgroundColor = data.bgColor;
      dom.style.opacity = 1 - data.bgTransparency;
      dom.style.borderRadius = data.hasCorner ? data.cornerRadius + 'px' : '0px';
      dom.style.color = data.textColor;
      dom.style.fontSize = data.textSize + 'px';
      dom.style.justifyContent = data.textAlign === 'Left' ? 'flex-start' : (data.textAlign === 'Right' ? 'flex-end' : 'center');
      dom.style.padding = data.textAlign !== 'Center' ? '0 8px' : '0';
      
      // Retain inner text without overwriting handle DOM
      const handleDom = dom.querySelector('.resize-handle');
      dom.innerText = data.text;
      if (handleDom) dom.appendChild(handleDom);

      // Border / UIStroke simulation
      if (data.hasBorder) {
        dom.style.border = `${data.borderThickness}px solid ${data.borderColor}`;
      } else {
        dom.style.border = 'none';
      }

      if (data.imageId) {
        dom.style.backgroundImage = `url("${data.imageId}")`;
      } else {
        dom.style.backgroundImage = 'none';
      }
    }

    function selectInstance(id) {
      selectedId = id;
      document.querySelectorAll('.studio-instance').forEach(el => el.classList.remove('selected'));
      const activeDom = document.getElementById(id);
      if (activeDom) activeDom.classList.add('selected');
      
      updateExplorer();
      updateProperties();
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      document.getElementById('btn-' + tabName).classList.add('active');
      document.getElementById('tab-' + tabName).classList.add('active');
    }

    function updateExplorer() {
      instanceCount.innerText = `${instances.length} Items`;
      explorerList.innerHTML = `<div class="tree-item" style="color: var(--studio-blue)">📂 ScreenGui</div>`;
      
      instances.forEach(inst => {
        const item = document.createElement('div');
        item.className = `tree-item ${inst.id === selectedId ? 'selected' : ''}`;
        const parentName = inst.parentId === 'ScreenGui' ? 'ScreenGui' : (instances.find(i=>i.id===inst.parentId)?.name || 'ScreenGui');
        item.innerHTML = `<span>📄 ${inst.name} <small style="color:#777">(${parentName})</small></span><small style="color:#00a2ff">${inst.type}</small>`;
        item.onclick = () => {
          selectInstance(inst.id);
          switchTab('properties');
        };
        explorerList.appendChild(item);
      });
    }

    function updateProperties() {
      const data = instances.find(e => e.id === selectedId);
      if (!data) {
        propertiesForm.innerHTML = `<p style="color: #666; text-align: center; padding: 20px;">Tap an element on screen to edit properties.</p>`;
        return;
      }

      let parentOptions = `<option value="ScreenGui" ${data.parentId==='ScreenGui'?'selected':''}>ScreenGui</option>`;
      instances.filter(i => i.type === 'Frame' && i.id !== data.id).forEach(f => {
        parentOptions += `<option value="${f.id}" ${data.parentId===f.id?'selected':''}>${f.name}</option>`;
      });

      propertiesForm.innerHTML = `
        <div class="prop-section-title">Hierarchy & Drag</div>
        <div class="prop-row"><label>Name</label><input type="text" value="${data.name}" onchange="setProp('name', this.value)"></div>
        <div class="prop-row"><label>Parent To</label><select onchange="setProp('parentId', this.value)">${parentOptions}</select></div>
        ${data.type === 'Frame' ? `<div class="prop-row"><label>Draggable (Mobile)</label><input type="checkbox" ${data.draggable?'checked':''} onchange="setProp('draggable', this.checked)"></div>` : ''}

        <div class="prop-section-title">Appearance & Size</div>
        <div class="prop-row"><label>Width (px)</label><input type="number" value="${data.width}" onchange="setProp('width', parseInt(this.value))"></div>
        <div class="prop-row"><label>Height (px)</label><input type="number" value="${data.height}" onchange="setProp('height', parseInt(this.value))"></div>
        <div class="prop-row"><label>Pos X</label><input type="number" value="${data.x}" onchange="setProp('x', parseInt(this.value))"></div>
        <div class="prop-row"><label>Pos Y</label><input type="number" value="${data.y}" onchange="setProp('y', parseInt(this.value))"></div>
        <div class="prop-row"><label>Background</label><input type="color" value="${data.bgColor}" onchange="setProp('bgColor', this.value)"></div>
        <div class="prop-row"><label>Transparency (0-1)</label><input type="number" step="0.1" min="0" max="1" value="${data.bgTransparency}" onchange="setProp('bgTransparency', parseFloat(this.value))"></div>

        <div class="prop-section-title">Border (UIStroke)</div>
        <div class="prop-row"><label>Enable Border</label><input type="checkbox" ${data.hasBorder?'checked':''} onchange="setProp('hasBorder', this.checked)"></div>
        <div class="prop-row"><label>Border Color</label><input type="color" value="${data.borderColor}" onchange="setProp('borderColor', this.value)"></div>
        <div class="prop-row"><label>Thickness (px)</label><input type="number" value="${data.borderThickness}" onchange="setProp('borderThickness', parseInt(this.value))"></div>

        <div class="prop-section-title">Corners (UICorner)</div>
        <div class="prop-row"><label>Rounded Corners</label><input type="checkbox" ${data.hasCorner?'checked':''} onchange="setProp('hasCorner', this.checked)"></div>
        <div class="prop-row"><label>Corner Radius</label><input type="number" value="${data.cornerRadius}" onchange="setProp('cornerRadius', parseInt(this.value))"></div>

        ${data.type !== 'Frame' ? `
          <div class="prop-section-title">Text Options</div>
          <div class="prop-row"><label>Text</label><input type="text" value="${data.text}" onchange="setProp('text', this.value)"></div>
          <div class="prop-row"><label>Text Color</label><input type="color" value="${data.textColor}" onchange="setProp('textColor', this.value)"></div>
          <div class="prop-row"><label>Text Size</label><input type="number" value="${data.textSize}" onchange="setProp('textSize', parseInt(this.value))"></div>
          <div class="prop-row"><label>Font</label>
            <select onchange="setProp('font', this.value)">
              <option value="GothamBold" ${data.font==='GothamBold'?'selected':''}>GothamBold</option>
              <option value="FredokaOne" ${data.font==='FredokaOne'?'selected':''}>FredokaOne</option>
              <option value="SourceSans" ${data.font==='SourceSans'?'selected':''}>SourceSans</option>
              <option value="Code" ${data.font==='Code'?'selected':''}>Code</option>
            </select>
          </div>
        ` : ''}

        ${data.type === 'ImageLabel' ? `
          <div class="prop-section-title">Roblox Image Asset</div>
          <div class="prop-row"><label>Asset ID / URL</label><input type="text" placeholder="rbxassetid://123456" value="${data.imageId}" onchange="setProp('imageId', this.value)"></div>
        ` : ''}

        ${data.type.includes('Button') ? `
          <div class="prop-section-title">Scripting</div>
          <div style="margin-top: 4px;">
            <textarea placeholder="Type Lua code for MouseButton1Click..." onchange="setProp('customScript', this.value)">${data.customScript}</textarea>
          </div>
        ` : ''}
      `;
    }

    function setProp(prop, val) {
      const data = instances.find(e => e.id === selectedId);
      if (data) {
        data[prop] = val;
        renderInstance(data);
        if (prop === 'name' || prop === 'parentId') updateExplorer();
      }
    }

    function quickAlign(type) {
      const data = instances.find(e => e.id === selectedId);
      if (!data) return;

      const parentDom = (data.parentId !== 'ScreenGui' && document.getElementById(data.parentId)) 
        ? document.getElementById(data.parentId) 
        : screenGui;

      if (type === 'center') {
        data.x = Math.round((parentDom.clientWidth - data.width) / 2);
        data.y = Math.round((parentDom.clientHeight - data.height) / 2);
      } else if (type === 'full') {
        data.x = 0;
        data.y = 0;
        data.width = parentDom.clientWidth;
        data.height = parentDom.clientHeight;
      }
      renderInstance(data);
      updateProperties();
    }

    function duplicateSelected() {
      const data = instances.find(e => e.id === selectedId);
      if (!data) return;

      counter++;
      const newInst = JSON.parse(JSON.stringify(data));
      newInst.id = 'inst_' + counter;
      newInst.name = data.type + counter;
      newInst.x = data.x + 10;
      newInst.y = data.y + 10;

      instances.push(newInst);
      renderInstance(newInst);
      updateExplorer();
      selectInstance(newInst.id);
    }

    function deleteSelected() {
      if (!selectedId) return;
      instances = instances.filter(e => e.id !== selectedId);
      const dom = document.getElementById(selectedId);
      if (dom) dom.remove();
      selectedId = null;
      updateExplorer();
      updateProperties();
    }

    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : '255, 255, 255';
    }

    function exportLua() {
      let code = `-- Roblox Mobile GUI Builder Script v2.1\n`;
      code += `local CoreGui = game:GetService("CoreGui")\n`;
      code += `local UserInputService = game:GetService("UserInputService")\n\n`;
      code += `local ScreenGui = Instance.new("ScreenGui")\n`;
      code += `ScreenGui.Name = "StudioWebGui"\n`;
      code += `ScreenGui.Parent = CoreGui\n\n`;

      instances.forEach(el => {
        const parentVar = el.parentId === 'ScreenGui' ? 'ScreenGui' : el.parentId;
        
        code += `-- ${el.name}\n`;
        code += `local ${el.name} = Instance.new("${el.type}")\n`;
        code += `${el.name}.Name = "${el.name}"\n`;
        code += `${el.name}.Parent = ${parentVar}\n`;
        code += `${el.name}.Position = UDim2.new(0, ${el.x}, 0, ${el.y})\n`;
        code += `${el.name}.Size = UDim2.new(0, ${el.width}, 0, ${el.height})\n`;
        code += `${el.name}.BackgroundColor3 = Color3.fromRGB(${hexToRgb(el.bgColor)})\n`;
        code += `${el.name}.BackgroundTransparency = ${el.bgTransparency}\n`;
        code += `${el.name}.BorderSizePixel = 0\n`;

        if (el.type !== 'Frame' && el.type !== 'ImageLabel') {
          code += `${el.name}.Text = "${el.text}"\n`;
          code += `${el.name}.TextColor3 = Color3.fromRGB(${hexToRgb(el.textColor)})\n`;
          code += `${el.name}.Font = Enum.Font.${el.font}\n`;
          code += `${el.name}.TextSize = ${el.textSize}\n`;
        }

        if (el.type === 'ImageLabel' && el.imageId) {
          code += `${el.name}.Image = "${el.imageId}"\n`;
        }

        if (el.hasCorner && el.cornerRadius > 0) {
          code += `local ${el.name}_Corner = Instance.new("UICorner")\n`;
          code += `${el.name}_Corner.CornerRadius = UDim.new(0, ${el.cornerRadius})\n`;
          code += `${el.name}_Corner.Parent = ${el.name}\n`;
        }

        if (el.hasBorder) {
          code += `local ${el.name}_Stroke = Instance.new("UIStroke")\n`;
          code += `${el.name}_Stroke.Color = Color3.fromRGB(${hexToRgb(el.borderColor)})\n`;
          code += `${el.name}_Stroke.Thickness = ${el.borderThickness}\n`;
          code += `${el.name}_Stroke.ApplyStrokeMode = Enum.ApplyStrokeMode.Border\n`;
          code += `${el.name}_Stroke.Parent = ${el.name}\n`;
        }

        if (el.draggable && el.type === 'Frame') {
          code += `\n-- Mobile Touch Drag for ${el.name}\n`;
          code += `${el.name}.Active = true\n`;
          code += `local dragging, dragStart, startPos\n`;
          code += `${el.name}.InputBegan:Connect(function(input)\n`;
          code += `    if input.UserInputType == Enum.UserInputType.MouseButton1 or input.UserInputType == Enum.UserInputType.Touch then\n`;
          code += `        dragging = true; dragStart = input.Position; startPos = ${el.name}.Position\n`;
          code += `    end\n`;
          code += `end)\n`;
          code += `UserInputService.InputChanged:Connect(function(input)\n`;
          code += `    if dragging and (input.UserInputType == Enum.UserInputType.MouseMovement or input.UserInputType == Enum.UserInputType.Touch) then\n`;
          code += `        local delta = input.Position - dragStart\n`;
          code += `        ${el.name}.Position = UDim2.new(startPos.X.Scale, startPos.X.Offset + delta.X, startPos.Y.Scale, startPos.Y.Offset + delta.Y)\n`;
          code += `    end\n`;
          code += `end)\n`;
          code += `UserInputService.InputEnded:Connect(function(input)\n`;
          code += `    if input.UserInputType == Enum.UserInputType.MouseButton1 or input.UserInputType == Enum.UserInputType.Touch then dragging = false end\n`;
          code += `end)\n`;
        }

        if (el.customScript && el.type.includes('Button')) {
          code += `\n${el.name}.MouseButton1Click:Connect(function()\n`;
          code += `    ${el.customScript.split('\n').join('\n    ')}\n`;
          code += `end)\n`;
        }
        code += `\n`;
      });

      document.getElementById('luaOutput').value = code;
      document.getElementById('codeModal').style.display = 'flex';
    }

    function closeModal() {
      const copyText = document.getElementById("luaOutput");
      copyText.select();
      navigator.clipboard.writeText(copyText.value);
      document.getElementById('codeModal').style.display = 'none';
      alert("Script copied to clipboard!");
    }
  </script>
</body>
</html>

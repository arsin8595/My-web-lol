<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Roblox Studio Mobile GUI</title>
  <style>
    :root {
      --bg-dark: #181818;
      --bg-panel: #222222;
      --bg-header: #2c2c2c;
      --bg-input: #121212;
      --border-color: #383838;
      --studio-blue: #00a2ff;
      --studio-red: #ff4d4d;
      --text-main: #dddddd;
      --text-bright: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* TOP TOOLBAR */
    header {
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: bold;
      background: #111111;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ribbon {
      display: flex;
      padding: 8px;
      gap: 8px;
      overflow-x: auto;
      background: var(--bg-header);
      -webkit-overflow-scrolling: touch;
    }

    .ribbon-btn {
      background: var(--bg-panel);
      color: var(--text-bright);
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .ribbon-btn:active {
      background: var(--studio-blue);
    }

    .export-btn {
      background: #008a00;
      border-color: #00b300;
    }

    /* CANVAS VIEWPORT AREA */
    .viewport-container {
      background: #0d0d0d;
      background-image: radial-gradient(#252525 1px, transparent 0);
      background-size: 16px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      position: relative;
      height: 280px;
      border-bottom: 1px solid var(--border-color);
    }

    #screen-gui {
      width: 100%;
      max-width: 340px;
      height: 240px;
      background: rgba(255, 255, 255, 0.03);
      border: 2px dashed #444444;
      position: relative;
      overflow: hidden;
      border-radius: 6px;
    }

    /* INSTANCES ON CANVAS */
    .studio-instance {
      position: absolute;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      touch-action: none;
    }

    .studio-instance.selected {
      outline: 2px solid var(--studio-blue);
      outline-offset: -1px;
    }

    /* MOBILE QUICK ACTION BAR (UNDER CANVAS) */
    .quick-bar {
      background: #1d1d1d;
      padding: 8px 12px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border-color);
      overflow-x: auto;
    }

    .action-btn {
      flex: 1;
      background: var(--bg-panel);
      color: var(--text-bright);
      border: 1px solid var(--border-color);
      padding: 10px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 6px;
      white-space: nowrap;
      text-align: center;
    }

    .action-btn.delete {
      background: #8b0000;
      border-color: var(--studio-red);
      color: #ffffff;
    }

    .action-btn.delete:active {
      background: var(--studio-red);
    }

    /* BOTTOM TAB SYSTEM (PROPERTIES & EXPLORER) */
    .bottom-system {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-panel);
      overflow: hidden;
    }

    .tab-headers {
      display: flex;
      background: #141414;
      border-bottom: 1px solid var(--border-color);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      color: #888;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
    }

    .tab-btn.active {
      color: var(--studio-blue);
      border-bottom-color: var(--studio-blue);
      background: var(--bg-panel);
    }

    .tab-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: none;
      -webkit-overflow-scrolling: touch;
    }

    .tab-content.active {
      display: block;
    }

    /* PROPERTIES FORM (TOUCH FRIENDLY) */
    .prop-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 10px;
    }

    .prop-row label {
      font-size: 12px;
      color: #aaa;
      width: 40%;
    }

    .prop-row input {
      flex: 1;
      height: 38px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 0 10px;
      border-radius: 6px;
      font-size: 14px; /* Prevents auto-zoom on iOS */
    }

    .prop-row input[type="color"] {
      padding: 2px;
      cursor: pointer;
    }

    /* EXPLORER ITEM LIST */
    .tree-item {
      padding: 12px;
      background: #1a1a1a;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tree-item.selected {
      border-color: var(--studio-blue);
      background: #003355;
    }

    /* SCRIPT EXPORT MODAL */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      padding: 16px;
      flex-direction: column;
    }

    .modal textarea {
      flex: 1;
      background: var(--bg-input);
      color: #00ffcc;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px;
      font-family: monospace;
      font-size: 11px;
      white-space: pre;
    }

    .modal-close {
      background: var(--studio-blue);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <header>
    <div class="top-bar">
      <span>Roblox Studio Mobile</span>
      <span id="instance-count" style="color: var(--studio-blue)">0 Items</span>
    </div>
    <div class="ribbon">
      <button class="ribbon-btn" onclick="addInstance('Frame')">🟩 + Frame</button>
      <button class="ribbon-btn" onclick="addInstance('TextButton')">🟦 + Button</button>
      <button class="ribbon-btn" onclick="addInstance('TextLabel')">🟨 + Label</button>
      <button class="ribbon-btn" onclick="addInstance('TextBox')">⬜ + TextBox</button>
      <button class="ribbon-btn export-btn" onclick="exportLua()">📜 Get Lua Code</button>
    </div>
  </header>

  <!-- WORKSPACE CANVAS -->
  <div class="viewport-container">
    <div id="screen-gui"></div>
  </div>

  <!-- QUICK ACTION TOOLBAR (MOBILE FRIENDLY) -->
  <div class="quick-bar">
    <button class="action-btn delete" onclick="deleteSelected()">🗑️ Delete</button>
    <button class="action-btn" onclick="quickAlign('center')">🎯 Center</button>
    <button class="action-btn" onclick="duplicateSelected()">📋 Duplicate</button>
    <button class="action-btn" onclick="quickAlign('full')">📐 Fill</button>
  </div>

  <!-- BOTTOM TABS (PROPERTIES & EXPLORER) -->
  <div class="bottom-system">
    <div class="tab-headers">
      <button class="tab-btn active" id="btn-properties" onclick="switchTab('properties')">⚙️ Properties</button>
      <button class="tab-btn" id="btn-explorer" onclick="switchTab('explorer')">📂 Explorer</button>
    </div>

    <!-- PROPERTIES PANEL -->
    <div class="tab-content active" id="tab-properties">
      <div id="properties-form">
        <p style="color: #666; text-align: center; padding: 20px;">Tap an element on the screen to edit its properties.</p>
      </div>
    </div>

    <!-- EXPLORER PANEL -->
    <div class="tab-content" id="tab-explorer">
      <div id="explorer-list">
        <div class="tree-item" style="color: var(--studio-blue)">📂 ScreenGui</div>
      </div>
    </div>
  </div>

  <!-- EXPORT SCRIPT MODAL -->
  <div class="modal" id="codeModal">
    <textarea id="luaOutput" readonly></textarea>
    <button class="modal-close" onclick="closeModal()">Copy Script & Close</button>
  </div>

  <script>
    const screenGui = document.getElementById('screen-gui');
    const explorerList = document.getElementById('explorer-list');
    const propertiesForm = document.getElementById('properties-form');
    const instanceCount = document.getElementById('instance-count');

    let instances = [];
    let selectedId = null;
    let counter = 0;

    function addInstance(type) {
      counter++;
      const id = 'inst_' + counter;
      
      const newInst = {
        id: id,
        type: type,
        name: type + counter,
        x: 20,
        y: 20,
        width: type === 'Frame' ? 140 : 100,
        height: type === 'Frame' ? 90 : 32,
        bgColor: type === 'Frame' ? '#252525' : '#333333',
        textColor: '#ffffff',
        text: type === 'Frame' ? '' : type,
        cornerRadius: 6
      };

      instances.push(newInst);
      renderInstance(newInst);
      updateExplorer();
      selectInstance(id);
    }

    function renderInstance(data) {
      let dom = document.getElementById(data.id);
      if (!dom) {
        dom = document.createElement('div');
        dom.id = data.id;
        dom.className = 'studio-instance';
        screenGui.appendChild(dom);

        // Smooth Touch Dragging for Mobile
        let isDragging = false;
        let startX, startY;

        const startMove = (e) => {
          isDragging = true;
          const touch = e.touches ? e.touches[0] : e;
          startX = touch.clientX - data.x;
          startY = touch.clientY - data.y;
          selectInstance(data.id);
        };

        const doMove = (e) => {
          if (!isDragging) return;
          if (e.touches) e.preventDefault(); // Prevents page from scrolling while dragging
          const touch = e.touches ? e.touches[0] : e;
          data.x = Math.max(0, Math.min(screenGui.clientWidth - data.width, touch.clientX - startX));
          data.y = Math.max(0, Math.min(screenGui.clientHeight - data.height, touch.clientY - startY));
          updateDom(data);
          updateProperties();
        };

        const endMove = () => { isDragging = false; };

        dom.addEventListener('touchstart', startMove, {passive: false});
        dom.addEventListener('touchmove', doMove, {passive: false});
        dom.addEventListener('touchend', endMove);
        dom.addEventListener('mousedown', startMove);
        window.addEventListener('mousemove', doMove);
        window.addEventListener('mouseup', endMove);
      }

      updateDom(data);
    }

    function updateDom(data) {
      const dom = document.getElementById(data.id);
      dom.style.left = data.x + 'px';
      dom.style.top = data.y + 'px';
      dom.style.width = data.width + 'px';
      dom.style.height = data.height + 'px';
      dom.style.backgroundColor = data.bgColor;
      dom.style.color = data.textColor;
      dom.style.borderRadius = data.cornerRadius + 'px';
      dom.innerText = data.text;
    }

    function selectInstance(id) {
      selectedId = id;
      document.querySelectorAll('.studio-instance').forEach(el => el.classList.remove('selected'));
      const activeDom = document.getElementById(id);
      if (activeDom) activeDom.classList.add('selected');
      
      updateExplorer();
      updateProperties();
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      document.getElementById('btn-' + tabName).classList.add('active');
      document.getElementById('tab-' + tabName).classList.add('active');
    }

    function updateExplorer() {
      instanceCount.innerText = `${instances.length} Items`;
      explorerList.innerHTML = `<div class="tree-item" style="color: var(--studio-blue)">📂 ScreenGui</div>`;
      
      instances.forEach(inst => {
        const item = document.createElement('div');
        item.className = `tree-item ${inst.id === selectedId ? 'selected' : ''}`;
        item.innerHTML = `<span>📄 ${inst.name}</span><small style="color:#777">${inst.type}</small>`;
        item.onclick = () => {
          selectInstance(inst.id);
          switchTab('properties');
        };
        explorerList.appendChild(item);
      });
    }

    function updateProperties() {
      const data = instances.find(e => e.id === selectedId);
      if (!data) {
        propertiesForm.innerHTML = `<p style="color: #666; text-align: center; padding: 20px;">Tap an element on the screen to edit its properties.</p>`;
        return;
      }

      propertiesForm.innerHTML = `
        <div class="prop-row"><label>Name</label><input type="text" value="${data.name}" onchange="setProp('name', this.value)"></div>
        <div class="prop-row"><label>Text</label><input type="text" value="${data.text}" onchange="setProp('text', this.value)"></div>
        <div class="prop-row"><label>Width (px)</label><input type="number" value="${data.width}" onchange="setProp('width', parseInt(this.value))"></div>
        <div class="prop-row"><label>Height (px)</label><input type="number" value="${data.height}" onchange="setProp('height', parseInt(this.value))"></div>
        <div class="prop-row"><label>Pos X</label><input type="number" value="${data.x}" onchange="setProp('x', parseInt(this.value))"></div>
        <div class="prop-row"><label>Pos Y</label><input type="number" value="${data.y}" onchange="setProp('y', parseInt(this.value))"></div>
        <div class="prop-row"><label>Background</label><input type="color" value="${data.bgColor}" onchange="setProp('bgColor', this.value)"></div>
        <div class="prop-row"><label>Corner Radius</label><input type="number" value="${data.cornerRadius}" onchange="setProp('cornerRadius', parseInt(this.value))"></div>
      `;
    }

    function setProp(prop, val) {
      const data = instances.find(e => e.id === selectedId);
      if (data) {
        data[prop] = val;
        renderInstance(data);
        if (prop === 'name') updateExplorer();
      }
    }

    function quickAlign(type) {
      const data = instances.find(e => e.id === selectedId);
      if (!data) return;

      if (type === 'center') {
        data.x = Math.round((screenGui.clientWidth - data.width) / 2);
        data.y = Math.round((screenGui.clientHeight - data.height) / 2);
      } else if (type === 'full') {
        data.x = 0;
        data.y = 0;
        data.width = screenGui.clientWidth;
        data.height = screenGui.clientHeight;
      }
      renderInstance(data);
      updateProperties();
    }

    function duplicateSelected() {
      const data = instances.find(e => e.id === selectedId);
      if (!data) return;

      counter++;
      const newInst = JSON.parse(JSON.stringify(data));
      newInst.id = 'inst_' + counter;
      newInst.name = data.type + counter;
      newInst.x = Math.min(screenGui.clientWidth - data.width, data.x + 15);
      newInst.y = Math.min(screenGui.clientHeight - data.height, data.y + 15);

      instances.push(newInst);
      renderInstance(newInst);
      updateExplorer();
      selectInstance(newInst.id);
    }

    function deleteSelected() {
      if (!selectedId) return;
      instances = instances.filter(e => e.id !== selectedId);
      const dom = document.getElementById(selectedId);
      if (dom) dom.remove();
      selectedId = null;
      updateExplorer();
      updateProperties();
    }

    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : '255, 255, 255';
    }

    function exportLua() {
      let code = `-- Roblox Mobile GUI Builder Script\n`;
      code += `local CoreGui = game:GetService("CoreGui")\n\n`;
      code += `local ScreenGui = Instance.new("ScreenGui")\n`;
      code += `ScreenGui.Name = "MobileStudioGui"\n`;
      code += `ScreenGui.Parent = CoreGui\n\n`;

      instances.forEach(el => {
        code += `-- ${el.name}\n`;
        code += `local ${el.name} = Instance.new("${el.type}")\n`;
        code += `${el.name}.Name = "${el.name}"\n`;
        code += `${el.name}.Parent = ScreenGui\n`;
        code += `${el.name}.Position = UDim2.new(0, ${el.x}, 0, ${el.y})\n`;
        code += `${el.name}.Size = UDim2.new(0, ${el.width}, 0, ${el.height})\n`;
        code += `${el.name}.BackgroundColor3 = Color3.fromRGB(${hexToRgb(el.bgColor)})\n`;
        code += `${el.name}.BorderSizePixel = 0\n`;

        if (el.type !== 'Frame') {
          code += `${el.name}.Text = "${el.text}"\n`;
          code += `${el.name}.TextColor3 = Color3.fromRGB(255, 255, 255)\n`;
          code += `${el.name}.Font = Enum.Font.GothamBold\n`;
          code += `${el.name}.TextSize = 12\n`;
        }

        if (el.cornerRadius > 0) {
          code += `local ${el.name}_Corner = Instance.new("UICorner")\n`;
          code += `${el.name}_Corner.CornerRadius = UDim.new(0, ${el.cornerRadius})\n`;
          code += `${el.name}_Corner.Parent = ${el.name}\n`;
        }
        code += `\n`;
      });

      document.getElementById('luaOutput').value = code;
      document.getElementById('codeModal').style.display = 'flex';
    }

    function closeModal() {
      const copyText = document.getElementById("luaOutput");
      copyText.select();
      navigator.clipboard.writeText(copyText.value);
      document.getElementById('codeModal').style.display = 'none';
      alert("Script copied to clipboard!");
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Roblox Studio Web - Mobile GUI Builder</title>
  <style>
    :root {
      --bg-dark: #191919;
      --bg-panel: #232323;
      --bg-header: #2d2d2d;
      --bg-input: #121212;
      --border-color: #333333;
      --studio-blue: #00a2ff;
      --studio-blue-hover: #0082cc;
      --text-main: #cccccc;
      --text-bright: #ffffff;
      --text-dim: #888888;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* TOP RIBBON TOOLBAR */
    header {
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .title-bar {
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      background: #141414;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ribbon {
      display: flex;
      padding: 6px;
      gap: 6px;
      overflow-x: auto;
      background: var(--bg-header);
    }

    .ribbon-btn {
      background: var(--bg-panel);
      color: var(--text-bright);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      white-space: nowrap;
    }

    .ribbon-btn:active {
      background: var(--studio-blue);
      border-color: var(--studio-blue);
    }

    .export-btn {
      background: #008a00;
      border-color: #00b300;
    }

    /* MAIN STUDIO WORKSPACE */
    .studio-workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* VIEWPORT / CANVAS */
    .viewport {
      flex: 1;
      background: #111111;
      background-image: radial-gradient(#222 1px, transparent 0);
      background-size: 12px 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    #screen-gui {
      width: 320px;
      height: 220px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed #444444;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    /* INSTANCES ON CANVAS */
    .studio-instance {
      position: absolute;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      touch-action: none;
    }

    .studio-instance.selected {
      outline: 2px solid var(--studio-blue);
      outline-offset: -1px;
    }

    /* SIDEBAR (EXPLORER & PROPERTIES) */
    .sidebar {
      width: 170px;
      background: var(--bg-panel);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .panel-header {
      background: var(--bg-header);
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-bright);
      border-bottom: 1px solid var(--border-color);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
    }

    /* EXPLORER TREE */
    .explorer-tree {
      flex: 1;
      overflow-y: auto;
      padding: 4px;
      font-size: 11px;
    }

    .tree-item {
      padding: 4px 6px;
      border-radius: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: var(--text-main);
    }

    .tree-item.selected {
      background: var(--studio-blue);
      color: var(--text-bright);
    }

    /* PROPERTIES WINDOW */
    .properties-grid {
      flex: 1.2;
      overflow-y: auto;
      padding: 6px;
      font-size: 10px;
      background: var(--bg-panel);
    }

    .prop-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 0;
      border-bottom: 1px solid #2a2a2a;
    }

    .prop-label {
      color: var(--text-dim);
      width: 45%;
    }

    .prop-input {
      width: 53%;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-bright);
      padding: 3px 5px;
      font-size: 10px;
      border-radius: 2px;
    }

    .prop-input[type="color"] {
      padding: 0;
      height: 18px;
      cursor: pointer;
    }

    /* QUICK ACTIONS TOOLBAR BELOW VIEWPORT */
    .quick-actions {
      position: absolute;
      bottom: 8px;
      left: 8px;
      display: flex;
      gap: 4px;
      z-index: 10;
    }

    .quick-btn {
      background: rgba(35, 35, 35, 0.9);
      color: var(--text-bright);
      border: 1px solid var(--border-color);
      padding: 4px 8px;
      font-size: 10px;
      border-radius: 3px;
      cursor: pointer;
    }

    /* SCRIPT EXPORT MODAL */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      padding: 16px;
      flex-direction: column;
    }

    .modal textarea {
      flex: 1;
      background: var(--bg-input);
      color: #a6e22e;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 10px;
      font-family: monospace;
      font-size: 11px;
      white-space: pre;
    }

    .modal-close {
      background: var(--studio-blue);
      color: white;
      border: none;
      padding: 8px;
      border-radius: 4px;
      font-weight: bold;
      margin-top: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="title-bar">
      <span>Roblox Studio Web - ScreenGui</span>
      <span id="instance-count">Instances: 0</span>
    </div>
    <div class="ribbon">
      <button class="ribbon-btn" onclick="addInstance('Frame')">🟩 + Frame</button>
      <button class="ribbon-btn" onclick="addInstance('TextButton')">🟦 + Button</button>
      <button class="ribbon-btn" onclick="addInstance('TextLabel')">🟨 + Label</button>
      <button class="ribbon-btn" onclick="addInstance('TextBox')">⬜ + TextBox</button>
      <button class="ribbon-btn export-btn" onclick="exportLua()">📜 Export Script</button>
    </div>
  </header>

  <div class="studio-workspace">
    
    <!-- CANVAS / VIEWPORT -->
    <div class="viewport">
      <div id="screen-gui"></div>

      <!-- Quick Alignment Helper -->
      <div class="quick-actions">
        <button class="quick-btn" onclick="quickAlign('center')">Center</button>
        <button class="quick-btn" onclick="quickAlign('full')">Fill Screen</button>
        <button class="quick-btn" style="color: #ff5555" onclick="deleteSelected()">Delete</button>
      </div>
    </div>

    <!-- SIDEBAR: EXPLORER & PROPERTIES -->
    <div class="sidebar">
      
      <div class="panel-header">EXPLORER</div>
      <div class="explorer-tree" id="explorer">
        <div class="tree-item" style="color: #00a2ff">📂 ScreenGui</div>
      </div>

      <div class="panel-header">PROPERTIES</div>
      <div class="properties-grid" id="properties">
        <p style="color: #666; text-align: center; margin-top: 10px;">Select an instance to edit properties.</p>
      </div>

    </div>
  </div>

  <!-- LUA SCRIPT MODAL -->
  <div class="modal" id="codeModal">
    <textarea id="luaOutput" readonly></textarea>
    <button class="modal-close" onclick="closeModal()">Copy to Clipboard & Close</button>
  </div>

  <script>
    const screenGui = document.getElementById('screen-gui');
    const explorer = document.getElementById('explorer');
    const properties = document.getElementById('properties');
    const instanceCount = document.getElementById('instance-count');

    let instances = [];
    let selectedId = null;
    let counter = 0;

    function addInstance(type) {
      counter++;
      const id = 'inst_' + counter;
      
      const newInst = {
        id: id,
        type: type,
        name: type + counter,
        x: 20,
        y: 20,
        width: type === 'Frame' ? 120 : 90,
        height: type === 'Frame' ? 80 : 26,
        bgColor: type === 'Frame' ? '#252525' : '#333333',
        textColor: '#ffffff',
        text: type === 'Frame' ? '' : type,
        cornerRadius: 4
      };

      instances.push(newInst);
      renderInstance(newInst);
      updateExplorer();
      selectInstance(id);
    }

    function renderInstance(data) {
      let dom = document.getElementById(data.id);
      if (!dom) {
        dom = document.createElement('div');
        dom.id = data.id;
        dom.className = 'studio-instance';
        screenGui.appendChild(dom);

        // Touch & Drag Handling for Mobile
        let isDragging = false;
        let startX, startY;

        const startMove = (e) => {
          isDragging = true;
          const touch = e.touches ? e.touches[0] : e;
          startX = touch.clientX - data.x;
          startY = touch.clientY - data.y;
          selectInstance(data.id);
        };

        const doMove = (e) => {
          if (!isDragging) return;
          const touch = e.touches ? e.touches[0] : e;
          data.x = Math.max(0, Math.min(screenGui.clientWidth - data.width, touch.clientX - startX));
          data.y = Math.max(0, Math.min(screenGui.clientHeight - data.height, touch.clientY - startY));
          updateDom(data);
          updateProperties();
        };

        const endMove = () => { isDragging = false; };

        dom.addEventListener('touchstart', startMove);
        dom.addEventListener('touchmove', doMove);
        dom.addEventListener('touchend', endMove);
        dom.addEventListener('mousedown', startMove);
        window.addEventListener('mousemove', doMove);
        window.addEventListener('mouseup', endMove);
      }

      updateDom(data);
    }

    function updateDom(data) {
      const dom = document.getElementById(data.id);
      dom.style.left = data.x + 'px';
      dom.style.top = data.y + 'px';
      dom.style.width = data.width + 'px';
      dom.style.height = data.height + 'px';
      dom.style.backgroundColor = data.bgColor;
      dom.style.color = data.textColor;
      dom.style.borderRadius = data.cornerRadius + 'px';
      dom.innerText = data.text;
    }

    function selectInstance(id) {
      selectedId = id;
      document.querySelectorAll('.studio-instance').forEach(el => el.classList.remove('selected'));
      const activeDom = document.getElementById(id);
      if (activeDom) activeDom.classList.add('selected');
      
      updateExplorer();
      updateProperties();
    }

    function updateExplorer() {
      instanceCount.innerText = `Instances: ${instances.length}`;
      explorer.innerHTML = `<div class="tree-item" style="color: #00a2ff">📂 ScreenGui</div>`;
      
      instances.forEach(inst => {
        const item = document.createElement('div');
        item.className = `tree-item ${inst.id === selectedId ? 'selected' : ''}`;
        item.style.paddingLeft = '18px';
        item.innerText = `📄 ${inst.name}`;
        item.onclick = () => selectInstance(inst.id);
        explorer.appendChild(item);
      });
    }

    function updateProperties() {
      const data = instances.find(e => e.id === selectedId);
      if (!data) {
        properties.innerHTML = `<p style="color: #666; text-align: center; margin-top: 10px;">Select an instance to edit.</p>`;
        return;
      }

      properties.innerHTML = `
        <div class="prop-row"><span class="prop-label">Name</span><input class="prop-input" type="text" value="${data.name}" onchange="setProp('name', this.value)"></div>
        <div class="prop-row"><span class="prop-label">Text</span><input class="prop-input" type="text" value="${data.text}" onchange="setProp('text', this.value)"></div>
        <div class="prop-row"><span class="prop-label">Width</span><input class="prop-input" type="number" value="${data.width}" onchange="setProp('width', parseInt(this.value))"></div>
        <div class="prop-row"><span class="prop-label">Height</span><input class="prop-input" type="number" value="${data.height}" onchange="setProp('height', parseInt(this.value))"></div>
        <div class="prop-row"><span class="prop-label">Position X</span><input class="prop-input" type="number" value="${data.x}" onchange="setProp('x', parseInt(this.value))"></div>
        <div class="prop-row"><span class="prop-label">Position Y</span><input class="prop-input" type="number" value="${data.y}" onchange="setProp('y', parseInt(this.value))"></div>
        <div class="prop-row"><span class="prop-label">BG Color</span><input class="prop-input" type="color" value="${data.bgColor}" onchange="setProp('bgColor', this.value)"></div>
        <div class="prop-row"><span class="prop-label">Corner Radius</span><input class="prop-input" type="number" value="${data.cornerRadius}" onchange="setProp('cornerRadius', parseInt(this.value))"></div>
      `;
    }

    function setProp(prop, val) {
      const data = instances.find(e => e.id === selectedId);
      if (data) {
        data[prop] = val;
        renderInstance(data);
        if (prop === 'name') updateExplorer();
      }
    }

    function quickAlign(type) {
      const data = instances.find(e => e.id === selectedId);
      if (!data) return;

      if (type === 'center') {
        data.x = Math.round((screenGui.clientWidth - data.width) / 2);
        data.y = Math.round((screenGui.clientHeight - data.height) / 2);
      } else if (type === 'full') {
        data.x = 0;
        data.y = 0;
        data.width = screenGui.clientWidth;
        data.height = screenGui.clientHeight;
      }
      renderInstance(data);
      updateProperties();
    }

    function deleteSelected() {
      instances = instances.filter(e => e.id !== selectedId);
      const dom = document.getElementById(selectedId);
      if (dom) dom.remove();
      selectedId = null;
      updateExplorer();
      updateProperties();
    }

    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : '255, 255, 255';
    }

    function exportLua() {
      let code = `-- Generated by Roblox Studio Web Builder\n`;
      code += `local CoreGui = game:GetService("CoreGui")\n\n`;
      code += `local ScreenGui = Instance.new("ScreenGui")\n`;
      code += `ScreenGui.Name = "StudioWebGui"\n`;
      code += `ScreenGui.Parent = CoreGui\n\n`;

      instances.forEach(el => {
        code += `-- ${el.name}\n`;
        code += `local ${el.name} = Instance.new("${el.type}")\n`;
        code += `${el.name}.Name = "${el.name}"\n`;
        code += `${el.name}.Parent = ScreenGui\n`;
        code += `${el.name}.Position = UDim2.new(0, ${el.x}, 0, ${el.y})\n`;
        code += `${el.name}.Size = UDim2.new(0, ${el.width}, 0, ${el.height})\n`;
        code += `${el.name}.BackgroundColor3 = Color3.fromRGB(${hexToRgb(el.bgColor)})\n`;
        code += `${el.name}.BorderSizePixel = 0\n`;

        if (el.type !== 'Frame') {
          code += `${el.name}.Text = "${el.text}"\n`;
          code += `${el.name}.TextColor3 = Color3.fromRGB(255, 255, 255)\n`;
          code += `${el.name}.Font = Enum.Font.GothamBold\n`;
          code += `${el.name}.TextSize = 11\n`;
        }

        if (el.cornerRadius > 0) {
          code += `local ${el.name}_Corner = Instance.new("UICorner")\n`;
          code += `${el.name}_Corner.CornerRadius = UDim.new(0, ${el.cornerRadius})\n`;
          code += `${el.name}_Corner.Parent = ${el.name}\n`;
        }
        code += `\n`;
      });

      document.getElementById('luaOutput').value = code;
      document.getElementById('codeModal').style.display = 'flex';
    }

    function closeModal() {
      const copyText = document.getElementById("luaOutput");
      copyText.select();
      navigator.clipboard.writeText(copyText.value);
      document.getElementById('codeModal').style.display = 'none';
      alert("Script copied to clipboard!");
    }
  </script>
</body>
</html>
